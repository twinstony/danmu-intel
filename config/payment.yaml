payment:
  # 收款链（用户定稿：仅 Polygon + Solana，明确排除 Base）
  chains:
    polygon:
      enabled: true
      # v1 公共免费 RPC（可运行时覆盖）
      rpc_url: "${DANMU_INTEL_POLYGON_RPC:-https://polygon-rpc.com}"
      # 原生 USDC（Circle 官方），非 USDC.e
      usdc_contract: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
      confirmation_blocks: 3
      poll_interval_seconds: 30

    solana:
      enabled: true
      # v1 社区公共端点（可运行时覆盖）
      rpc_url: "${DANMU_INTEL_SOLANA_RPC:-https://api.mainnet-beta.solana.com}"
      # SPL USDC Mint
      usdc_mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
      confirmation: "finalized"
      poll_interval_seconds: 20

  # 收款钱包
  # ⚠️ 绝不在本文件中写入私钥/助记词/xpub 明文！
  # 以下字段由环境变量在运行时注入（DANMU_INTEL_XPU / DANMU_INTEL_SOL_ADDRESS）
  wallet:
    evm_xpub: "${DANMU_INTEL_XPU}"            # 扩展公钥，只读派生，无私钥
    solana_address: "${DANMU_INTEL_SOL_ADDRESS}"  # 单一收款地址，靠 reference 区分付款人

  pricing:
    trial:
      amount: 1
      currency: "USDC"
      duration_days: 3

    monthly:
      amount: 59
      currency: "USDC"
      duration_days: 30

    quarterly:
      amount: 105
      currency: "USDC"
      duration_days: 90

    yearly:
      amount: 390
      currency: "USDC"
      duration_days: 365

    # 早鸟（v1 默认关闭，启用时填 deadline）
    early_bird:
      enabled: false
      monthly: 39
      quarterly: 105
      yearly: 390
      deadline: null  # 启用时填 ISO 日期，如 "2026-10-31"

    # 梯度涨价（老用户终身锁价）
    ladder:
      threshold: 20
      increment_pct: 20
      max_monthly: 99
      max_yearly: 986

  # 订阅生命周期
  subscription:
    grace_period_days: 3          # 到期宽限期
    remind_days_before: [3, 1]    # 到期前提醒节点
    downgrade_on_expire: true     # 到期自动降级免费账号

  # 安全边界
  security:
    private_key_never_stored: true  # 不变式：服务器不持有任何私钥
    derivation_in_worker: true      # 地址派生必须在异步 worker，禁止 web 请求内
    max_address_derivation_per_run: 100  # 单次派生上限
